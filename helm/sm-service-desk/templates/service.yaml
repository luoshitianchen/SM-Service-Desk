# Service: ClusterIP，targetPort 对应业务端口 8027
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sm-service-desk.fullname" . }}
  labels:
    {{- include "sm-service-desk.commonLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sm-service-desk.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
