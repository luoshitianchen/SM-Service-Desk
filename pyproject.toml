[project]
name = "SM-Service-Desk"
version = "2.0.0"
description = "企业智能客服与工单系统：工单、SLA、分派、升级与闭环"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
